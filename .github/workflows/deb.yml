name: Debian package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and qualify Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: false
      - name: Build from the wheel and qualify the extracted payload
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-deb.sh --out-dir "$RUNNER_TEMP/deb"
      - name: Upload Debian binary package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soulsteads-agent-home-deb
          path: ${{ runner.temp }}/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
