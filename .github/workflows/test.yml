name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPYCACHEPREFIX: /tmp/soulsteads-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          test -f tests/test_cli.py
          test -f tests/test_core.py
          test -f tests/test_runtimes.py
          test -f tests/test_safety.py
          python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: soulsteads --help
