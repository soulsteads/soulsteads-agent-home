[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soulsteads"
version = "0.1.0"
description = "Portable, locally versioned homes for coding agents"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Soulsteads"}]
dependencies = []

[project.optional-dependencies]
hermes = ["PyYAML>=6.0.2,<7"]

[project.scripts]
soulsteads = "soulsteads.cli:main"

[tool.setuptools.packages.find]
include = ["soulsteads*"]
